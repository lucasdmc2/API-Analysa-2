# .tech_stack.yaml - chosen per project (managed by Context Manager)
language: python            # e.g., python | javascript | typescript | go | java
backend_framework: fastapi  # e.g., fastapi | nestjs | springboot | gin | ...
database: postgres          # e.g., postgres | mysql | mongodb | ...
frontend_framework: react   # e.g., react | next | vue | svelte | ...
test_framework: pytest      # e.g., pytest | jest | junit | ...
deployment: docker          # e.g., docker | kubernetes | railway | vercel | ...
orm: sqlalchemy             # optional
ci: github_actions          # optional
